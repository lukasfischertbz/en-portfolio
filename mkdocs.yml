site_name: Portfolio

nav:
  - Home: index.md
  - Summer 2026: summer-2026.md

theme:
  name: material
  palette:
    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Zu Dark Mode wechseln

    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Zu Light Mode wechseln
